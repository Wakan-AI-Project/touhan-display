name: Company Pages preview (manual)

# Company parallel publication authorized by the user on 2026-10-22.
# Manual dispatch only; never changes the original site or Google data.
on:
  workflow_dispatch:
    inputs:
      confirm_company_preview:
        description: Publish the approved company preview
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: company-pages-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'Wakan-AI-Project/touhan-display' && inputs.confirm_company_preview
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Patch and verify actual Node24 runtime before Actions
        shell: bash
        run: |
          set -euo pipefail
          current_pid="$PPID"
          node_bin=""
          for attempt in {1..12}; do
            executable="$(readlink -f "/proc/$current_pid/exe" || true)"
            if [[ "${executable##*/}" == 'Runner.Worker' ]]; then
              runner_root="$(dirname "$(dirname "$executable")")"
              candidate="$runner_root/externals/node24/bin/node"
              if [[ -x "$candidate" ]]; then node_bin="$candidate"; break; fi
            fi
            current_pid="$(ps -o ppid= -p "$current_pid" | tr -d ' ')"
            if [[ -z "$current_pid" || "$current_pid" == 0 ]]; then break; fi
          done
          if [[ -z "$node_bin" ]]; then
            echo 'Runner.Worker sibling Node24 executable was not found.' >&2
            exit 1
          fi
          echo "VENDOR_RUNTIME_VERSION=$($node_bin --version)"
          # This GitHub-hosted job VM is disposable. Patch only its Actions
          # runtime, before any JavaScript action; never touch a Mac or server.
          if ! "$node_bin" -e 'const v=process.versions.node.split(".").map(Number); process.exit(v[0]===24&&(v[1]>22||(v[1]===22&&v[2]>=1))?0:1);'; then
            [[ "$(uname -s)" == Linux && "$(uname -m)" == x86_64 ]]
            [[ -w "$(dirname "$node_bin")" ]]
            patch_dir="$(mktemp -d "$RUNNER_TEMP/node-runtime-patch.XXXXXX")"
            archive="$patch_dir/node-v24.22.1-linux-x64.tar.xz"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              'https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-x64.tar.xz' -o "$archive"
            echo "6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  $archive" | sha256sum --check
            tar -xJf "$archive" -C "$patch_dir" node-v24.22.1-linux-x64/bin/node
            patched_node="$patch_dir/node-v24.22.1-linux-x64/bin/node"
            [[ "$("$patched_node" --version)" == v24.22.1 ]]
            install -m 755 "$patched_node" "$node_bin.patched"
            mv -f "$node_bin.patched" "$node_bin"
          fi
          echo "RUNTIME_PATH=$node_bin"
          "$node_bin" -p "'RUNTIME_VERSION=' + process.version"
          "$node_bin" -p "'RUNTIME_EXECUTABLE=' + process.execPath"
          "$node_bin" -e 'const v=process.versions.node.split(".").map(Number); const fixed=v[0]===24&&(v[1]>22||(v[1]===22&&v[2]>=1)); console.log("VERSION_MEETS_OFFICIAL_FIX_THRESHOLD="+fixed);'
          
          "$node_bin" -e 'const v=process.versions.node.split(".").map(Number); process.exit(v[0]===24&&(v[1]>22||(v[1]===22&&v[2]>=1))?0:1);'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify unchanged publication files
        shell: bash
        run: |
          echo "a15cb209a74ebac27aa03605ff1e047f03208d69ad42a4856148b35f0a364597  site/index.html" | sha256sum --check
          echo "1a5732d0f7ca7db9fcae867c222f9199e538080a0951b0ebb75adfc385a65748  site/staff-schedule.html" | sha256sum --check
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6 (node24)
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0 (nested node24)
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5 (node24)
