	<script>
	(function () {
		// ====================================
		// ここにGASデプロイURLを設定
		// ====================================
		var GAS_URL = 'https://script.google.com/macros/s/AKfycbxpBTnvoYNDUfDB1Rk99dKtUj977bn0cZozkpUHWHDsVl9Fa4OmUsjAJIbMSwAKzojf/exec';

		// キャッシュキー（日付が変わったら再取得）
		var today = new Date();
		var todayKey = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
		var cacheKey = 'staffSchedule_' + todayKey;

		// キャッシュチェック
		var cached = null;
		try {
			var raw = localStorage.getItem(cacheKey);
			if (raw) {
				cached = JSON.parse(raw);
			}
		} catch (e) {}

		if (cached) {
			renderSchedule(cached);
		} else {
			// GASからデータ取得
			$.ajax({
				url: GAS_URL,
				dataType: 'json',
				timeout: 10000,
				success: function (data) {
					// 古いキャッシュを削除
					try {
						for (var i = localStorage.length - 1; i >= 0; i--) {
							var key = localStorage.key(i);
							if (key && key.indexOf('staffSchedule_') === 0 && key !== cacheKey) {
								localStorage.removeItem(key);
							}
						}
						localStorage.setItem(cacheKey, JSON.stringify(data));
					} catch (e) {}
					renderSchedule(data);
				},
				error: function () {
					$('#schedule-content').html(
						'<div class="staff-schedule__error">データの取得に失敗しました。<br>ページを再読み込みしてください。</div>'
					);
				}
			});
		}

		function renderSchedule(data) {
			// 日付表示
			$('#schedule-date').text(data.date + '（' + data.dayOfWeek + '）');

			if (data.message && data.staff.length === 0) {
				$('#schedule-content').html(
					'<div class="staff-schedule__empty">' + escapeHtml(data.message) + '</div>'
				);
				return;
			}

			if (data.staff.length === 0) {
				$('#schedule-content').html(
					'<div class="staff-schedule__empty">本日の出勤者はおりません。</div>'
				);
				return;
			}

			var html = '<table class="staff-schedule__table">';
			html += '<thead><tr><th>氏名</th><th>勤務時間</th></tr></thead>';
			html += '<tbody>';
			for (var i = 0; i < data.staff.length; i++) {
				html += '<tr>';
				html += '<td>' + escapeHtml(data.staff[i].name) + '</td>';
				html += '<td>' + escapeHtml(data.staff[i].hours) + '</td>';
				html += '</tr>';
			}
			html += '</tbody></table>';
			$('#schedule-content').html(html);
		}

		function escapeHtml(str) {
			if (!str) return '';
			return String(str)
				.replace(/&/g, '&amp;')
				.replace(/</g, '&lt;')
				.replace(/>/g, '&gt;')
				.replace(/"/g, '&quot;');
		}
	})();
	</script>
