<!doctype html>
<html lang="ja">

<head>
	<meta charset="utf-8">
	<title>登録販売者 勤務状況│和漢の森</title>
	<meta name="keywords" content="和漢の森,登録販売者,勤務状況,出勤">
	<meta name="description" content="和漢の森 糸島薬店の登録販売者の本日の勤務状況をご確認いただけます。">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="format-detection" content="telephone=no">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;600&display=swap">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }

		:root {
			--brand-red: #b5232f;
			--brand-red-light: #d4434e;
			--brand-brown: #4a3728;
			--brand-brown-light: #6b5344;
			--bg-cream: #faf7f2;
			--bg-warm-white: #fffdf9;
			--text-main: #3e3230;
			--text-sub: #7a6e6a;
			--text-light: #a89e9a;
			--border-warm: #e8ddd4;
			--accent-green: #5a8a3c;
			--accent-green-bg: #f0f5eb;
		}

		body {
			font-family: 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', sans-serif;
			color: var(--text-main);
			background: var(--bg-cream);
			line-height: 1.8;
			min-height: 100vh;
		}

		/* ===== ヘッダー ===== */
		.header {
			background: var(--bg-warm-white);
			text-align: center;
			padding: 18px 20px 14px;
			border-bottom: 1px solid var(--border-warm);
		}
		.header__logo {
			font-family: 'Noto Serif JP', serif;
			font-size: 20px;
			font-weight: 600;
			color: var(--brand-brown);
			letter-spacing: 0.2em;
		}

		/* ===== パンくず ===== */
		.breadcrumbs {
			max-width: 680px;
			margin: 14px auto 0;
			padding: 0 20px;
			font-size: 12px;
			color: var(--text-light);
		}
		.breadcrumbs a {
			color: var(--text-sub);
			text-decoration: none;
		}
		.breadcrumbs a:hover {
			color: var(--brand-red);
		}
		.breadcrumbs__sep {
			margin: 0 6px;
			color: var(--border-warm);
		}

		/* ===== メイン ===== */
		.main {
			max-width: 680px;
			margin: 0 auto;
			padding: 28px 20px 80px;
		}

		/* ===== ページタイトル ===== */
		.page-title {
			text-align: center;
			margin-bottom: 32px;
		}
		.page-title__label {
			display: inline-block;
			font-size: 11px;
			color: var(--brand-red);
			letter-spacing: 0.15em;
			border: 1px solid var(--brand-red);
			border-radius: 2px;
			padding: 2px 12px;
			margin-bottom: 12px;
		}
		.page-title__text {
			font-family: 'Noto Serif JP', serif;
			font-size: 26px;
			font-weight: 600;
			color: var(--brand-brown);
			letter-spacing: 0.08em;
		}
		.page-title__line {
			width: 40px;
			height: 2px;
			background: var(--brand-red);
			margin: 14px auto 0;
			border-radius: 1px;
		}

		/* ===== 勤務状況カード ===== */
		.schedule-card {
			background: var(--bg-warm-white);
			border-radius: 12px;
			padding: 32px 28px;
			box-shadow: 0 2px 12px rgba(74, 55, 40, 0.06);
			border: 1px solid var(--border-warm);
		}

		/* 日付表示 */
		.schedule-card__date {
			text-align: center;
			font-family: 'Noto Serif JP', serif;
			font-size: 20px;
			font-weight: 400;
			color: var(--brand-brown);
			margin-bottom: 6px;
			letter-spacing: 0.06em;
		}
		.schedule-card__count {
			text-align: center;
			font-size: 13px;
			color: var(--text-sub);
			margin-bottom: 24px;
		}
		.schedule-card__count strong {
			color: var(--brand-red);
			font-weight: 500;
		}

		/* 区切り線 */
		.schedule-card__divider {
			border: none;
			height: 1px;
			background: var(--border-warm);
			margin: 0 0 24px;
		}

		/* スタッフリスト */
		.staff-list {
			list-style: none;
		}
		.staff-item {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 14px 16px;
			border-radius: 8px;
			transition: background 0.15s;
		}
		.staff-item:nth-child(odd) {
			background: rgba(250, 247, 242, 0.6);
		}
		.staff-item:hover {
			background: rgba(181, 35, 47, 0.03);
		}
		.staff-item__name {
			font-size: 15px;
			font-weight: 500;
			color: var(--text-main);
			letter-spacing: 0.04em;
		}
		.staff-item__hours {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			font-size: 14px;
			font-weight: 500;
			color: var(--accent-green);
			background: var(--accent-green-bg);
			padding: 4px 14px;
			border-radius: 20px;
		}
		.staff-item__hours::before {
			content: '';
			display: inline-block;
			width: 6px;
			height: 6px;
			background: var(--accent-green);
			border-radius: 50%;
		}

		/* 注釈 */
		.schedule-card__note {
			text-align: center;
			margin-top: 28px;
			padding-top: 20px;
			border-top: 1px solid var(--border-warm);
			font-size: 12px;
			color: var(--text-light);
			line-height: 2;
		}

		/* 空・読み込み・エラー */
		.schedule-card__empty {
			text-align: center;
			padding: 48px 0;
			font-size: 16px;
			color: var(--text-sub);
		}
		.schedule-card__empty-icon {
			font-size: 36px;
			margin-bottom: 12px;
			opacity: 0.4;
		}
		.schedule-card__loading {
			text-align: center;
			padding: 48px 0;
			font-size: 14px;
			color: var(--text-light);
		}
		.schedule-card__loading-dot {
			display: inline-block;
			animation: pulse 1.2s ease-in-out infinite;
		}
		.schedule-card__loading-dot:nth-child(2) { animation-delay: 0.2s; }
		.schedule-card__loading-dot:nth-child(3) { animation-delay: 0.4s; }
		@keyframes pulse {
			0%, 80%, 100% { opacity: 0.3; }
			40% { opacity: 1; }
		}
		.schedule-card__error {
			text-align: center;
			padding: 24px;
			color: var(--brand-red);
			font-size: 14px;
			background: #fdf2f2;
			border-radius: 8px;
		}

		/* ===== フッター ===== */
		.footer {
			text-align: center;
			padding: 24px 20px;
			font-size: 11px;
			color: var(--text-light);
			letter-spacing: 0.05em;
		}
		.footer a {
			color: var(--text-sub);
			text-decoration: none;
		}
		.footer a:hover {
			color: var(--brand-red);
		}

		/* ===== レスポンシブ ===== */
		@media screen and (max-width: 640px) {
			.schedule-card {
				padding: 24px 16px;
				border-radius: 8px;
			}
			.page-title__text { font-size: 22px; }
			.schedule-card__date { font-size: 18px; }
			.staff-item { padding: 12px 10px; }
			.staff-item__name { font-size: 14px; }
			.staff-item__hours { font-size: 13px; padding: 3px 10px; }
		}
	</style>
</head>

<body>

	<header class="header">
		<div class="header__logo">和漢の森</div>
	</header>

	<nav class="breadcrumbs">
		<a href="https://www.wakan.shop/">トップ</a>
		<span class="breadcrumbs__sep">&gt;</span>
		<a href="https://www.wakan.shop/medicine/">医薬品販売について</a>
		<span class="breadcrumbs__sep">&gt;</span>
		登録販売者 勤務状況
	</nav>

	<main class="main">
		<div class="page-title">
			<div class="page-title__label">STAFF SCHEDULE</div>
			<h1 class="page-title__text">登録販売者 勤務状況</h1>
			<div class="page-title__line"></div>
		</div>

		<div class="schedule-card">
			<div id="schedule-date" class="schedule-card__date"></div>
			<div id="schedule-count" class="schedule-card__count"></div>
			<hr class="schedule-card__divider">
			<div id="schedule-content">
				<div class="schedule-card__loading">
					<span class="schedule-card__loading-dot">&#9679;</span>
					<span class="schedule-card__loading-dot">&#9679;</span>
					<span class="schedule-card__loading-dot">&#9679;</span>
				</div>
			</div>
			<p class="schedule-card__note">
				※ シフトにより変動する場合がございます<br>
				※ 本ページは毎日自動で更新されます
			</p>
		</div>
	</main>

	<footer class="footer">
		<a href="https://www.wakan.shop/">&copy; 和漢の森 糸島薬店</a>
	</footer>

	<script>
	(function () {
		var GAS_URL = 'https://script.google.com/macros/s/AKfycbxpBTnvoYNDUfDB1Rk99dKtUj977bn0cZozkpUHWHDsVl9Fa4OmUsjAJIbMSwAKzojf/exec';

		var today = new Date();
		var todayKey = today.getFullYear() + '-' + (today.getMonth() + 1) + '-' + today.getDate();
		var cacheKey = 'staffSchedule_' + todayKey;

		var cached = null;
		try {
			var raw = localStorage.getItem(cacheKey);
			if (raw) cached = JSON.parse(raw);
		} catch (e) {}

		if (cached) {
			renderSchedule(cached);
		} else {
			fetch(GAS_URL)
				.then(function (res) { return res.json(); })
				.then(function (data) {
					try {
						for (var i = localStorage.length - 1; i >= 0; i--) {
							var key = localStorage.key(i);
							if (key && key.indexOf('staffSchedule_') === 0 && key !== cacheKey) {
								localStorage.removeItem(key);
							}
						}
						localStorage.setItem(cacheKey, JSON.stringify(data));
					} catch (e) {}
					renderSchedule(data);
				})
				.catch(function () {
					document.getElementById('schedule-content').innerHTML =
						'<div class="schedule-card__error">データの取得に失敗しました。<br>ページを再読み込みしてください。</div>';
				});
		}

		function renderSchedule(data) {
			document.getElementById('schedule-date').textContent = data.date + '（' + data.dayOfWeek + '）';

			if (data.message && data.staff.length === 0) {
				document.getElementById('schedule-count').textContent = '';
				document.getElementById('schedule-content').innerHTML =
					'<div class="schedule-card__empty">' +
					'<div class="schedule-card__empty-icon">&#128716;</div>' +
					escapeHtml(data.message) + '</div>';
				return;
			}

			var working = [];
			for (var i = 0; i < data.staff.length; i++) {
				var s = data.staff[i];
				if (s.hours !== '不在' && s.hours !== '休' && s.hours !== '休み' && s.hours !== '-') {
					working.push(s);
				}
			}

			if (working.length === 0) {
				document.getElementById('schedule-count').textContent = '';
				document.getElementById('schedule-content').innerHTML =
					'<div class="schedule-card__empty">' +
					'<div class="schedule-card__empty-icon">&#128716;</div>' +
					'本日の出勤者はおりません</div>';
				return;
			}

			document.getElementById('schedule-count').innerHTML =
				'本日 <strong>' + working.length + '名</strong> が対応いたします';

			var html = '<ul class="staff-list">';
			for (var i = 0; i < working.length; i++) {
				html += '<li class="staff-item">';
				html += '<span class="staff-item__name">' + escapeHtml(working[i].name) + '</span>';
				html += '<span class="staff-item__hours">' + escapeHtml(working[i].hours) + '</span>';
				html += '</li>';
			}
			html += '</ul>';
			document.getElementById('schedule-content').innerHTML = html;
		}

		function escapeHtml(str) {
			if (!str) return '';
			var div = document.createElement('div');
			div.appendChild(document.createTextNode(str));
			return div.innerHTML;
		}
	})();
	</script>

</body>

</html>
